<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar — BorderKick</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/extra.css">
</head>
<body class="auth-body" data-page="login">
<header class="topbar" id="topo"></header>
<main class="auth-layout">
  <section class="auth-photo">
    <span class="eyebrow">ÁREA DO TORCEDOR</span>
    <h1>Sua Copa começa <span class="lime">aqui.</span></h1>
    <p>Acesse sua conta para montar o pacote, acompanhar a validação do visto e emitir seu voucher.</p>
  </section>
  <section class="auth-panel">
    <div class="auth-logo"><span class="brand-mark">BK</span><h2>Entrar</h2><p>Use o e-mail e a senha do seu cadastro.</p></div>
    <form class="demo-form" id="f">
      <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" required autocomplete="username" placeholder="voce@email.com"></div>
      <div class="field"><label for="senha">Senha</label><input id="senha" name="senha" type="password" required autocomplete="current-password" placeholder="••••••••"></div>
      <p class="alert alert-erro" id="aviso" role="alert" hidden></p>
      <button class="btn btn-lime btn-block" type="submit">Entrar →</button>
    </form>
    <p class="form-foot">Ainda não tem conta? <a class="text-link" href="cadastro.html">Cadastre-se</a></p>
  </section>
</main>
<script src="js/script.js"></script>
</body></html>
