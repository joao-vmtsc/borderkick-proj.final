services:
  - type: web
    name: borderkick
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - {key: NODE_ENV, value: production}
      - {key: NODE_VERSION, value: "20"}
      - {key: JWT_SECRET, generateValue: true}
      - {key: ATENDENTE_EMAIL, value: atendente@borderkick.com}
      - {key: ATENDENTE_SENHA, sync: false}
      - {key: DB_HOST, sync: false}
      - {key: DB_PORT, sync: false}
      - {key: DB_USER, sync: false}
      - {key: DB_PASSWORD, sync: false}
      - {key: DB_NAME, sync: false}
      - {key: DB_SSL, value: "true"}
